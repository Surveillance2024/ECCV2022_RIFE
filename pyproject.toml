[project]
name = "ECCV2022_RIFE"
version = "0.1.0"
description = "Real-Time Intermediate Flow Estimation for Video Frame Interpolation (RIFE)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.16",
    "tqdm>=4.35.0",
    "sk-video>=1.1.10",
    "torch>=1.6.0",
    "opencv-python>=4.1.2",
    "moviepy>=1.0.3",
    "torchvision>=0.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["eccv2022_rife*"]

[tool.setuptools.package-data]
"eccv2022_rife" = ["train_log/*.pkl"]
